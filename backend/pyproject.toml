[project]
name = "ia-voy-backend"
version = "1.0.0"
description = "API de IA voy: análisis de repositorios Python"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "httpx>=0.28",
    "pydantic-settings>=2.6",
    "cryptography>=44",
    # Analizadores estáticos: corren sobre el clon (análisis) y sobre un archivo (editor)
    "ruff>=0.15",
    "bandit>=1.8",
    "radon>=6.0",
    # Similitud de embeddings del asistente
    "numpy>=2.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.3"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 160
# Proyecto de ejemplo con problemas a propósito (lo analiza app/seed.py)
extend-exclude = ["seed_data"]

[tool.ruff.lint]
# B008: `Depends(...)` como valor por defecto es el estilo normal de FastAPI
extend-ignore = ["B008"]
