function hl(src){
  const re = /("[^"]*"|'[^']*')|(#.*$)|\b(def|return|import|from|is|not|None|and|or|if|else|class|for|in|True|False|with|as|raise|lambda)\b|\b(\d+)\b/g;
  let out='', last=0, m;
  while((m = re.exec(src))){
    out += esc(src.slice(last, m.index));
    const t = esc(m[0]);
    out += m[1] ? `<span class="tok-s">${t}</span>` : m[2] ? `<span class="tok-c">${t}</span>` : m[3] ? `<span class="tok-k">${t}</span>` : `<span class="tok-n">${t}</span>`;
    last = re.lastIndex;
  }
  return out + esc(src.slice(last));
}
function deltaBadge(d, big){

}
function ring(v, size=64, sw=7, cls=''){
  const r=(size-sw)/2, c=2*Math.PI*r, t=TONE[tone(v)];
  return `<div class="relative shrink-0 ${cls}" style="width:${size}px;height:${size}px">
    <svg width="${size}" height="${size}" class="-rotate-90"><circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke-width="${sw}" class="stroke-slate-100 dark:stroke-slate-800"/>
    <circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="${t.hex}" stroke-width="${sw}" stroke-linecap="round" stroke-dasharray="${c}" stroke-dashoffset="${c*(1-v/100)}" style="transition:stroke-dashoffset .8s ease"/></svg>
    <div class="absolute inset-0 grid place-items-center font-bold tabular-nums ${t.text}" style="font-size:${Math.round(size*0.27)}px">${size>80?f1(v):Math.round(v)}</div></div>`;
}

  el.innerHTML = `${ic}<p class="text-sm flex-1">${msg}</p>${opt.action?`<button onclick="${opt.action[1]};closeToast('${id}')" class="${C.ghost} text-brand-600 dark:text-brand-300">${opt.action[0]}</button>`:''}<button onclick="closeToast('${id}')" class="p-1.5 rounded-lg text-slate-400 hover:bg-slate-100 dark:hover:bg-slate-800">${icon('x','w-4 h-4')}</button>`;

}

function series(r){
  const n = r.hist.seg.length;
  const g = r.hist.seg.map((_,i)=>calc(r.hist.seg[i], r.hist.test[i], r.hist.prac[i]));
  return { global:[...g, score(r)], seg:[...r.hist.seg, r.seg], test:[...r.hist.test, r.test], prac:[...r.hist.prac, r.prac], n:n+1 };
}
function chart(r){
  const d = series(r), W=640, H=230, pl=34, pr=14, pt=14, pb=30;
  const keys = [['global','Global',BRAND],['seg',CAT.seg.label,CAT.seg.hex],['test',CAT.test.label,CAT.test.hex],['prac',CAT.prac.label,CAT.prac.hex]];
  const all = keys.filter(k=>!S.hidden.has(k[0])).flatMap(k=>d[k[0]]);
  const lo = Math.max(0, Math.floor((Math.min(...(all.length?all:[40]))-5)/10)*10), hi = 100;
  const x = i => pl + i*(W-pl-pr)/(d.n-1), y = v => pt + (1-(v-lo)/(hi-lo))*(H-pt-pb);
  const ticks = []; for(let v=lo; v<=hi; v+=lo<=40?20:10) ticks.push(v);
  const gid = 'g'+r.id;
  let svg = `<svg viewBox="0 0 ${W} ${H}" class="w-full h-auto" role="img" aria-label="Tendencia de puntuación"><defs><linearGradient id="${gid}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${BRAND}" stop-opacity=".22"/><stop offset="1" stop-color="${BRAND}" stop-opacity="0"/></linearGradient></defs>`;
  svg += ticks.map(v=>`<line x1="${pl}" x2="${W-pr}" y1="${y(v)}" y2="${y(v)}" class="stroke-slate-100 dark:stroke-slate-800" stroke-width="1"/><text x="${pl-8}" y="${y(v)+4}" text-anchor="end" class="fill-slate-400" font-size="11">${v}</text>`).join('');
  svg += DATES.map((l,i)=>`<text x="${x(i)}" y="${H-8}" text-anchor="middle" class="fill-slate-400" font-size="11">${l}</text>`).join('');
  if(!S.hidden.has('global')){ const pts = d.global.map((v,i)=>`${x(i)},${y(v)}`).join(' '); svg += `<polygon points="${x(0)},${y(lo)} ${pts} ${x(d.n-1)},${y(lo)}" fill="url(#${gid})"/>`; }
  keys.slice().reverse().forEach(([k,,c])=>{ if(S.hidden.has(k)) return;
    const g = k==='global';
    svg += `<polyline points="${d[k].map((v,i)=>`${x(i)},${y(v)}`).join(' ')}" fill="none" stroke="${c}" stroke-width="${g?3:2}" stroke-linejoin="round" stroke-linecap="round" ${g?'':'stroke-dasharray="0" opacity=".85"'}/>`;
    svg += d[k].map((v,i)=>`<circle cx="${x(i)}" cy="${y(v)}" r="${g?4.5:3}" fill="${c}" class="stroke-white dark:stroke-slate-900" stroke-width="2"><title>${DATES[i]} · ${k==='global'?'Global':CAT[k].label}: ${f1(v)}</title></circle>`).join('');
  });
  return svg + '</svg>' + `<div class="flex flex-wrap gap-2 mt-3">${keys.map(([k,l,c])=>`<button onclick="toggleSeries('${k}')" class="inline-flex items-center gap-1.5 rounded-lg px-2.5 py-1 text-xs font-medium border transition ${S.hidden.has(k)?'border-slate-200 dark:border-slate-800 text-slate-400 line-through':'border-slate-200 dark:border-slate-700 hover:bg-slate-50 dark:hover:bg-slate-800'}"><span class="w-2.5 h-2.5 rounded-full" style="background:${c}"></span>${l}</button>`).join('')}</div>`;
}
function toggleSeries(k){ S.hidden.has(k) ? S.hidden.delete(k) : S.hidden.add(k); refresh(); }

  if (j.fail && j.step===5){ j.status='error'; j.logs.push("  ERROR: ModuleNotFoundError: No module named 'stripe'", '  El análisis se detuvo. Revisa requirements.txt.'); clearInterval(S.timer); toast('El análisis falló en pytest',{tone:'err',action:['Ver detalle',"go('analizar')"]}); }
  else {
    if (extra[j.step]) j.logs.push(extra[j.step]);
    j.logs.push('  ✓ ok');
    j.step++;
    if (j.step >= JOB_STEPS.length){ j.status='done'; j.logs.push('Análisis #129 completado.'); clearInterval(S.timer); toast('Análisis completado',{action:['Ver reporte',"S.job=null;go('reporte')"]}); }
    else pushLog();
  }
  renderJobPill();
  if (route()==='analizar') refresh();
}

}

function onLineEdit(el){ const n=+el.dataset.n, file=S.file, orig=CODE[file].find(l=>l[0]===n)[1], t=el.textContent; S.edits[file]=S.edits[file]||{}; if(t===orig) delete S.edits[file][n]; else S.edits[file][n]=t; const b=$('#dirty'); if(b) b.classList.toggle('hidden', !edited(file)); }

  const r=repo('r1'), before=score(r);

function addChip(list, inp){ const v=inp.value.trim(); if(v && !S[list].includes(v)){ S[list].push(v); refresh(); } }
function removeChip(list, i){ S[list].splice(i,1); refresh(); }
function chipList(list, ph){ return `<div class="flex flex-wrap gap-2 mb-3">${S[list].map((x,i)=>`<span class="inline-flex items-center gap-1 rounded-lg bg-slate-100 dark:bg-slate-800 pl-2.5 pr-1 py-1 text-xs font-mono">${esc(x)}<button onclick="removeChip('${list}',${i})" class="p-0.5 rounded hover:bg-slate-200 dark:hover:bg-slate-700 text-slate-400" aria-label="Quitar">${icon('x','w-3 h-3')}</button></span>`).join('') || '<span class="text-xs text-slate-400">Ninguna</span>'}</div>
  <form onsubmit="event.preventDefault();addChip('${list}',this.v)" class="flex gap-2"><input name="v" placeholder="${ph}" class="${C.input} py-2 font-mono text-xs"><button class="${C.btn2} py-2 shrink-0">Agregar</button></form>`; }
PAGES.config = () => `
  <div class="mb-6"><h1 class="${C.h1}">Configuración</h1><p class="${C.sub} mt-1">Ajustes del proyecto <b>equipo/api-pagos</b>. Se guardan en <code class="font-mono">.ia_voy.toml</code>.</p></div>
  <div class="grid lg:grid-cols-3 gap-4">
    <div class="lg:col-span-2 space-y-4">
      <section class="${C.card} p-5 sm:p-6">
        <div class="flex items-center justify-between mb-1"><h2 class="font-semibold">Pesos del score</h2><span id="wsum" class="text-xs font-semibold text-emerald-600 dark:text-emerald-400">Suma: ${wsum()}%</span></div>
        <p class="${C.sub} mb-5">Cuánto aporta cada categoría al score global.</p>
        <div class="space-y-5">${['seg','test','prac'].map(k=>`<div><div class="flex items-center gap-2 mb-2"><span class="w-7 h-7 rounded-lg grid place-items-center ${CAT[k].soft}">${icon(CAT[k].icon,'w-4 h-4')}</span><span class="text-sm font-medium">${CAT[k].label}</span><span id="wv-${k}" class="ml-auto font-mono text-sm font-semibold">${S.weights[k]}%</span></div><input type="range" min="0" max="100" step="5" value="${S.weights[k]}" oninput="updateWeights('${k}',this.value)" class="w-full"></div>`).join('')}</div>
        <p id="wnote" class="${wsum()===100?'hidden':''} mt-4 text-xs text-amber-700 dark:text-amber-300 bg-amber-50 dark:bg-amber-500/10 rounded-lg p-3">Los pesos no suman 100 %; se normalizarán automáticamente al calcular.</p>
        <div class="mt-4 rounded-xl bg-slate-50 dark:bg-slate-950 p-3 text-sm flex items-center justify-between"><span class="text-slate-500">Score de api-pagos con estos pesos</span><b id="wprev" class="tabular-nums">${f1(score(repo('r1')))}</b></div>
      </section>
      <section class="${C.card} p-5 sm:p-6"><h2 class="font-semibold mb-4">Umbrales mínimos</h2>
        <div class="grid sm:grid-cols-2 gap-4">
          <div><label class="${C.label}">Score global mínimo</label><input type="number" min="0" max="100" value="${S.thr.score}" onchange="S.thr.score=+this.value;$('#toml').textContent=toml()" class="${C.input}"><p class="text-xs text-slate-400 mt-1">Por debajo, el reporte se marca en rojo.</p></div>
          <div><label class="${C.label}">Cobertura mínima (%)</label><input type="number" min="0" max="100" value="${S.thr.cov}" onchange="S.thr.cov=+this.value;$('#toml').textContent=toml()" class="${C.input}"><p class="text-xs text-slate-400 mt-1">Archivos por debajo generan un hallazgo.</p></div>
        </div></section>
      <section class="grid sm:grid-cols-2 gap-4">
        <div class="${C.card} p-5"><h2 class="font-semibold mb-1">Reglas ignoradas</h2><p class="${C.sub} mb-3">Códigos de Bandit o Ruff.</p>${chipList('ignored','p. ej. E501')}</div>
        <div class="${C.card} p-5"><h2 class="font-semibold mb-1">Rutas excluidas</h2><p class="${C.sub} mb-3">No se analizan.</p>${chipList('excluded','p. ej. scripts/')}</div>
      </section>
    </div>
    <div class="space-y-4">
      <section class="${C.card} p-5"><h2 class="font-semibold mb-4">Servicios</h2>
        <div class="space-y-3">${[['Gemini 2.5 Flash','Modelo principal','emerald','Operativo'],['Groq · Llama 3.3','Respaldo ante 429','slate','En espera'],['Cloudflare Tunnel','ia-voy.trycloudflare.com','emerald','Activo'],['Sandbox WSL2','Ejecución aislada','emerald','Listo']].map(([a,b,c,s])=>`<div class="flex items-center gap-3"><span class="w-2 h-2 rounded-full ${c==='emerald'?'bg-emerald-500':'bg-slate-400'}"></span><div class="flex-1 min-w-0"><p class="text-sm font-medium">${a}</p><p class="text-xs text-slate-400 truncate">${b}</p></div><span class="text-xs ${c==='emerald'?'text-emerald-600 dark:text-emerald-400':'text-slate-400'}">${s}</span></div>`).join('')}</div></section>
      <section class="rounded-2xl bg-slate-950 border border-slate-800 overflow-hidden"><div class="px-4 py-2.5 border-b border-slate-800 flex items-center justify-between"><span class="text-xs font-mono text-slate-400">.ia_voy.toml</span><span class="text-[10px] text-slate-500">vista previa en vivo</span></div><pre id="toml" class="p-4 text-xs font-mono text-slate-300 overflow-x-auto scroll-thin leading-relaxed">${toml()}</pre></section>
      <button onclick="toast('Configuración guardada')" class="${C.btn} w-full">${icon('save','w-4 h-4')}Guardar configuración</button>
    </div>
  </div>`;

/* =========================================================
   Login y vista pública
   ========================================================= */
function pLogin(){ return `
  <div class="min-h-screen grid lg:grid-cols-2">
    <div class="hidden lg:flex relative overflow-hidden bg-gradient-to-br from-brand-600 via-brand-700 to-fuchsia-700 text-white p-12 flex-col justify-between">
      <div class="absolute -left-20 -bottom-20 w-96 h-96 rounded-full bg-fuchsia-400/30 blur-3xl"></div><div class="absolute right-0 top-10 w-72 h-72 rounded-full bg-white/10 blur-3xl"></div>
      <div class="relative flex items-center gap-3"><div class="w-10 h-10 rounded-xl bg-white/15 grid place-items-center font-extrabold">IA</div><span class="text-xl font-bold">IA voy</span></div>
      <div class="relative"><h2 class="text-4xl font-extrabold tracking-tight leading-tight">Calidad de código Python,<br>medida y explicada.</h2>
        <div class="mt-8 space-y-3">${['seg','test','prac'].map(k=>`<div class="flex items-center gap-3 rounded-2xl bg-white/10 backdrop-blur px-4 py-3"><span class="w-9 h-9 rounded-xl bg-white/15 grid place-items-center">${icon(CAT[k].icon,'w-4 h-4')}</span><div><p class="font-semibold text-sm">${CAT[k].label}</p><p class="text-xs text-white/70">${CAT[k].tools}</p></div></div>`).join('')}</div></div>
      <p class="relative text-xs text-white/60">Proyecto académico · 2026</p>
    </div>
    <div class="flex items-center justify-center p-6 relative">
      <button onclick="toggleTheme()" class="absolute top-4 right-4 p-2 rounded-xl hover:bg-slate-100 dark:hover:bg-slate-800 text-slate-500"><span class="dark:hidden">${icon('moon')}</span><span class="hidden dark:inline">${icon('sun')}</span></button>
      <form onsubmit="event.preventDefault();go('dashboard');setTimeout(()=>toast('Bienvenida de nuevo, Ana'),150)" class="w-full max-w-sm fade-in">
        <div class="lg:hidden flex items-center gap-3 mb-8"><div class="w-10 h-10 rounded-xl bg-gradient-to-br from-brand-500 to-fuchsia-500 text-white grid place-items-center font-extrabold text-sm">IA</div><span class="text-xl font-bold">IA voy</span></div>
        <h1 class="text-2xl font-bold tracking-tight">Inicia sesión</h1><p class="${C.sub} mt-1 mb-8">Acceso solo para miembros del equipo.</p>
        <div class="space-y-4">
          <div><label class="${C.label}" for="l-e">Correo</label><input id="l-e" type="email" required value="ana@equipo.dev" class="${C.input}"></div>
          <div><div class="flex justify-between"><label class="${C.label}" for="l-p">Contraseña</label><button type="button" onclick="toast('Pide a quien administra el equipo que restablezca tu acceso',{tone:'info'})" class="text-xs text-brand-600 dark:text-brand-300 hover:underline">¿La olvidaste?</button></div><input id="l-p" type="password" required value="demo1234" class="${C.input}"></div>
          <label class="flex items-center gap-2 text-sm text-slate-600 dark:text-slate-400"><input type="checkbox" checked class="w-4 h-4 accent-brand-600">Mantener sesión iniciada</label>
          <button class="${C.btn} w-full py-3">Entrar ${icon('arrow','w-4 h-4')}</button>
        </div>
        <p class="mt-8 text-xs text-center text-slate-400">¿Solo quieres ver un reporte compartido? <button type="button" onclick="go('compartido')" class="text-brand-600 dark:text-brand-300 hover:underline">Ábrelo aquí</button></p>
      </form>
    </div>
  </div>`; }
function unlockShared(v){ if(!S.share.password || v===S.share.password){ S.unlocked=true; render(); } else toast('Contraseña incorrecta',{tone:'err'}); }
function pShared(){
  const r=repo('r1'), sc=score(r), back=`<button onclick="go('reporte')" class="fixed bottom-4 left-4 z-50 inline-flex items-center gap-2 rounded-xl bg-slate-900 dark:bg-white text-white dark:text-slate-900 text-xs font-semibold px-3 py-2 shadow-xl">${icon('arrow','w-3.5 h-3.5 rotate-180')}Volver al prototipo</button>`;
  const head = `<header class="border-b border-slate-200 dark:border-slate-800 bg-white dark:bg-slate-900"><div class="max-w-4xl mx-auto px-4 sm:px-6 h-16 flex items-center gap-3"><div class="w-8 h-8 rounded-lg bg-gradient-to-br from-brand-500 to-fuchsia-500 text-white grid place-items-center font-extrabold text-xs">IA</div><span class="font-bold">IA voy</span><span class="${C.chip} bg-slate-100 text-slate-600 ring-slate-500/20 dark:bg-slate-800 dark:text-slate-300 dark:ring-slate-700 ml-1">${icon('eye','w-3 h-3')}Solo lectura</span><button onclick="toggleTheme()" class="ml-auto p-2 rounded-xl hover:bg-slate-100 dark:hover:bg-slate-800 text-slate-500"><span class="dark:hidden">${icon('moon')}</span><span class="hidden dark:inline">${icon('sun')}</span></button></div></header>`;
  if (S.share.pwd && !S.unlocked) return `${head}<div class="min-h-[70vh] grid place-items-center p-6"><form onsubmit="event.preventDefault();unlockShared(this.p.value)" class="${C.card} p-6 sm:p-8 w-full max-w-sm text-center fade-in"><span class="mx-auto w-12 h-12 rounded-2xl bg-brand-100 dark:bg-brand-500/15 text-brand-600 dark:text-brand-300 grid place-items-center">${icon('lock')}</span><h1 class="text-lg font-semibold mt-4">Reporte protegido</h1><p class="${C.sub} mt-1 mb-5">Escribe la contraseña que te compartieron.</p><input name="p" type="password" autofocus class="${C.input} text-center" placeholder="Contraseña"><button class="${C.btn} w-full mt-3">Ver reporte</button></form></div>${back}`;
  return `${head}
  <main class="max-w-4xl mx-auto px-4 sm:px-6 py-8 fade-in">
    <div class="rounded-xl bg-amber-50 dark:bg-amber-500/10 border border-amber-200 dark:border-amber-500/20 px-4 py-2.5 text-xs sm:text-sm text-amber-800 dark:text-amber-200 flex items-center gap-2 mb-6">${icon('clock','w-4 h-4 shrink-0')}Este enlace ${S.share.exp==='0'?'no expira':`expira en ${S.share.exp} día(s)`} · compartido por Ana López</div>
    <section class="${C.card} p-6 flex flex-col sm:flex-row items-center gap-6 text-center sm:text-left">${ring(sc,120,10)}<div class="flex-1"><p class="${C.sub}">Reporte de calidad</p><h1 class="text-2xl font-bold tracking-tight">${r.name}</h1><p class="text-sm text-slate-500 mt-1">Rama ${r.branch} · commit <span class="font-mono">${r.commit}</span> · 13 oct 2026</p></div></section>
    <div class="grid sm:grid-cols-3 gap-3 mt-4">${['seg','test','prac'].map(k=>`<div class="${C.card} p-4"><div class="flex items-center gap-2"><span class="w-8 h-8 rounded-lg grid place-items-center ${CAT[k].soft}">${icon(CAT[k].icon,'w-4 h-4')}</span><span class="text-sm font-medium">${CAT[k].label}</span><span class="ml-auto text-xl font-bold ${TONE[tone(r[k])].text}">${r[k]}</span></div><div class="mt-3">${bar(r[k],CAT[k].bar)}</div></div>`).join('')}</div>
    <section class="${C.card} mt-4 overflow-hidden"><div class="p-5 border-b border-slate-200 dark:border-slate-800"><h2 class="font-semibold">Hallazgos principales</h2></div>
      <div class="divide-y divide-slate-100 dark:divide-slate-800">${FINDINGS.filter(f=>f.sev!=='baja').map(f=>`<div class="px-5 py-3 flex flex-col sm:flex-row sm:items-center gap-2 sm:gap-4"><div class="flex items-center gap-2 sm:w-36 shrink-0">${sevBadge(f.sev)}<span class="font-mono text-xs text-slate-500">${f.rule}</span></div><div class="flex-1 min-w-0"><p class="text-sm font-medium">${f.msg}</p><p class="text-xs font-mono text-slate-400">${f.file}:${f.line}</p></div>${catChip(f.cat)}</div>`).join('')}</div></section>
    <p class="text-center text-xs text-slate-400 mt-8">Generado con IA voy · los fragmentos de código ${S.share.code?'están incluidos':'no se incluyen en enlaces públicos'}</p>
  </main>${back}`;
}

hydrateIcons();
if (!location.hash) history.replaceState(null,'','#/flujo');
render();
